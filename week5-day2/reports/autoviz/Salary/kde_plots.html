      html, body {

      #loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        flex-direction: column;
        gap: 16px;
      }
      #loader.error {
        background: none;
      }
      #loader .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #3498db;
        border-radius: 50%;
        animation: pn-loader-spin 1s linear infinite;
      }
      #loader-msg {
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        text-align: center;
      }
      #loader-msg:empty, #loader.error #loader-msg {
        display: none;
      }
      #loader-error {
        display: none;
        color: #d32f2f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        text-align: center;
        padding: 12px 20px;
        background: rgba(211, 47, 47, 0.08);
        border: 1px solid rgba(211, 47, 47, 0.3);
        border-radius: 8px;
      }

      for (const state of ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED']) {
